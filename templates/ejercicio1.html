<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Notas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Formulario de Notas</h2>
        <!-- method="POST" es para enviar los datos de forma segura al archivo main.py -->
        <form method="POST">
            <label>Nota 1:</label>
            <input type="number" name="nota1" min="10" max="70" required>

            <label>Nota 2:</label>
            <input type="number" name="nota2" min="10" max="70" required>

            <label>Nota 3:</label>
            <input type="number" name="nota3" min="10" max="70" required>

            <label>Asistencia (%):</label>
            <input type="number" name="asistencia" min="0" max="100" required>

            <button type="submit" class="btn">Enviar</button>
        </form>

        <!-- Este bloque de Python solo se muestra si hay un resultado -->
        {% if promedio is not none %}
        <div class="resultado">
            <p><strong>Promedio:</strong> {{ promedio }}</p>
            <p><strong>Estado:</strong> {{ estado }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
